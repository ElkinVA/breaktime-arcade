name: breaktime-arcade

x-app: &app
  image: ba/app:${IMAGE_TAG:-dev}
  build:
    context: .
    args:
      PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.14-slim-bookworm}
      NODE_IMAGE: ${NODE_IMAGE:-node:22-bookworm-slim}
      UV_VERSION: ${UV_VERSION:?задайте UV_VERSION в .env (make env)}
  restart: unless-stopped
  env_file: [.env]
  user: "10001:10001"
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
  volumes:
    - static_data:/app/staticfiles
    - media_data:/app/media
    - app_var:/app/var
  networks: [internal, edge]
  depends_on:
    zip-volume-init: { condition: service_completed_successfully }
    db: { condition: service_healthy }
    redis-cache: { condition: service_healthy }
    redis-broker: { condition: service_healthy }
    redis-zip: { condition: service_healthy }
    redis-throttle: { condition: service_healthy }
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  # P3: web writes zip_uploads and reads zip_artifacts; zip-worker needs the
  # inverse. Named volumes are root-owned on first creation, so a short-lived
  # init step hands both roots to the shared non-root UID before either starts.
  zip-volume-init:
    image: ba/app:${IMAGE_TAG:-dev}
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mkdir -p /var/ba/zip/uploads /var/ba/zip/artifacts /var/ba/zip/quota /app/runtime &&
        chown 10001:10001 /var/ba/zip/uploads /var/ba/zip/artifacts /var/ba/zip/quota /app/runtime &&
        chmod 700 /var/ba/zip/uploads /var/ba/zip/artifacts /var/ba/zip/quota &&
        chmod 755 /app/runtime
    volumes:
      - zip_uploads:/var/ba/zip/uploads
      - zip_artifacts:/var/ba/zip/artifacts
      - zip_quota:/var/ba/zip/quota
      - runtime_data:/app/runtime
    network_mode: "none"
    read_only: true
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "DAC_OVERRIDE", "FOWNER"]
    security_opt: ["no-new-privileges:true"]
    restart: "no"

  web:
    <<: *app
    environment:
      RUN_MIGRATIONS: "1"
      RUN_COLLECTSTATIC: "1"
      ZIP_PUBLIC_RUNTIME_ROOT: /app/runtime
      # ARCADE-P4-STORAGE-001: non-secret system-wide ZIP quota defaults.
      ZIP_QUOTA_STATE_ROOT: "${ZIP_QUOTA_STATE_ROOT:-/var/ba/zip/quota}"
      ZIP_STORAGE_QUOTA_BYTES: "${ZIP_STORAGE_QUOTA_BYTES:-2147483648}"
      ZIP_STORAGE_MIN_FREE_BYTES: "${ZIP_STORAGE_MIN_FREE_BYTES:-157286400}"
      ZIP_QUOTA_RESERVATION_TTL_SECONDS: "${ZIP_QUOTA_RESERVATION_TTL_SECONDS:-3600}"
      # Browser autotest runs in a dedicated secretless container.
      BROWSER_AUTOTEST_URL: "${BROWSER_AUTOTEST_URL:-http://browser-autotest:8100/run}"
      # ARCADE-REDIS-BROKER-ISOLATION-001: ZIP jobs go to the isolated broker.
      CELERY_ZIP_BROKER_URL: "${CELERY_ZIP_BROKER_URL:-redis://redis-zip:6379/0}"
    networks: [internal, edge, autotestnet]
    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/media
      - app_var:/app/var
      - runtime_data:/app/runtime
      - zip_uploads:/var/ba/zip/uploads
      - zip_artifacts:/var/ba/zip/artifacts:ro
      - zip_quota:/var/ba/zip/quota
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    deploy:
      resources:
        limits: { cpus: "1.5", memory: 1536M }

  worker:
    <<: *app
    command: ["celery", "-A", "config", "worker", "-Q", "default,celery", "-l", "info"]
    environment:
      RUN_MIGRATIONS: "0"
      # Orphan-runtime cleanup scans/deletes the published runtime volume.
      ZIP_PUBLIC_RUNTIME_ROOT: /app/runtime
      # Dispatches ZIP cleanup to redis-zip; extraction uses the same publisher.
      CELERY_ZIP_BROKER_URL: "${CELERY_ZIP_BROKER_URL:-redis://redis-zip:6379/0}"
    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/media
      - app_var:/app/var
      - runtime_data:/app/runtime
      - zip_uploads:/var/ba/zip/uploads
    depends_on:
      db: { condition: service_healthy }
      redis-cache: { condition: service_healthy }
      redis-broker: { condition: service_healthy }
      web: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "timeout -k 2 8 celery -A config inspect ping -d celery@$$HOSTNAME -t 5 | grep -q pong"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1024M }

  # BA-ZIP-WORKER-001: isolated extraction worker.
  # Network zipnet contains only this service and redis-zip; no edge/db/cache.
  zip-worker:
    image: ba/app:${IMAGE_TAG:-dev}
    build:
      context: .
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.14-slim-bookworm}
        NODE_IMAGE: ${NODE_IMAGE:-node:22-bookworm-slim}
        UV_VERSION: ${UV_VERSION:?задайте UV_VERSION в .env (make env)}
    restart: unless-stopped
    user: "10001:10001"
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    entrypoint: ["/app/infra/scripts/entrypoint-zip-worker.sh"]
    command: ["celery", "-A", "config", "worker", "-Q", "zip", "-n", "zip@%h",
              "--pool=prefork", "--concurrency=1", "--prefetch-multiplier=1",
              "--without-gossip", "--without-mingle", "-l", "info"]
    # Least privilege: this process parses untrusted ZIPs, so it gets only an
    # explicit non-secret allowlist instead of the full .env (database, mail,
    # S3, backup and signing secrets are intentionally absent). Compose
    # interpolation still reads .env/.env.staging for these named variables.
    environment:
      DJANGO_SETTINGS_MODULE: "${DJANGO_SETTINGS_MODULE:-config.settings.prod}"
      # Fixed to the isolated broker; never follows the shared .env value.
      CELERY_BROKER_URL: "redis://redis-zip:6379/0"
      RUN_MIGRATIONS: "0"
      RUN_COLLECTSTATIC: "0"
      # Shared quota state/lock; must be writable here for artifact admission.
      ZIP_QUOTA_STATE_ROOT: "${ZIP_QUOTA_STATE_ROOT:-/var/ba/zip/quota}"
      ZIP_STORAGE_QUOTA_BYTES: "${ZIP_STORAGE_QUOTA_BYTES:-2147483648}"
      ZIP_STORAGE_MIN_FREE_BYTES: "${ZIP_STORAGE_MIN_FREE_BYTES:-157286400}"
      ZIP_QUOTA_RESERVATION_TTL_SECONDS: "${ZIP_QUOTA_RESERVATION_TTL_SECONDS:-3600}"
      # Non-secret hardening/retention knobs; defaults mirror base.py.
      ZIP_DISK_RESERVE_BYTES: "${ZIP_DISK_RESERVE_BYTES:-157286400}"
      ZIP_JOB_DEADLINE_SECONDS: "${ZIP_JOB_DEADLINE_SECONDS:-50}"
      ZIP_JOB_MAX_BYTES: "${ZIP_JOB_MAX_BYTES:-125829120}"
      ZIP_STAGING_TTL_SECONDS: "${ZIP_STAGING_TTL_SECONDS:-3600}"
      ZIP_COMPLETED_TTL_SECONDS: "${ZIP_COMPLETED_TTL_SECONDS:-86400}"
    volumes:
      - zip_uploads:/var/ba/zip/uploads:ro
      - zip_artifacts:/var/ba/zip/artifacts
      - zip_quota:/var/ba/zip/quota
    networks: [zipnet]
    depends_on:
      zip-volume-init: { condition: service_completed_successfully }
      redis-zip: { condition: service_healthy }
    read_only: true
    tmpfs:
      - /tmp:rw,size=64m,mode=1777
    pids_limit: 64
    ulimits:
      nofile: { soft: 1024, hard: 1024 }
    cpus: "1.0"
    mem_limit: 512m
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "timeout -k 2 8 celery -A config inspect ping -d zip@$$HOSTNAME -t 5 | grep -q pong"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # ARCADE-BROWSER-AUTOTEST-001: untrusted game JavaScript runs here, never in
  # web. No env_file, no database/Redis credentials, no edge/egress network.
  browser-autotest:
    image: ba/app:${IMAGE_TAG:-dev}
    build:
      context: .
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.14-slim-bookworm}
        NODE_IMAGE: ${NODE_IMAGE:-node:22-bookworm-slim}
        UV_VERSION: ${UV_VERSION:?задайте UV_VERSION в .env (make env)}
    restart: unless-stopped
    user: "10001:10001"
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    entrypoint: ["python", "-m", "apps.pipeline.services.browser_service"]
    command: []
    environment:
      HOME: /tmp
      BROWSER_AUTOTEST_BIND: "0.0.0.0"
      BROWSER_AUTOTEST_PORT: "8100"
      BROWSER_AUTOTEST_RESOLVER: "nginx"
      BROWSER_AUTOTEST_HEADLESS: "true"
      BROWSER_AUTOTEST_INSECURE_TLS: "${BROWSER_AUTOTEST_INSECURE_TLS:-false}"
      BROWSER_AUTOTEST_CONCURRENCY: "1"
    networks: [autotestnet]
    depends_on:
      nginx: { condition: service_healthy }
    read_only: true
    tmpfs:
      - /tmp:rw,size=512m,mode=1777
    shm_size: 256m
    pids_limit: 256
    cpus: "1.0"
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8100/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  beat:
    <<: *app
    command: ["celery", "-A", "config", "beat", "-l", "info", "--schedule", "/app/var/celerybeat-schedule"]
    profiles: ["beat"]
    depends_on:
      redis-broker: { condition: service_healthy }
      web: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import glob,os,time,sys; fs=glob.glob('/app/var/celerybeat-schedule*'); sys.exit(0 if fs and time.time()-max(os.path.getmtime(f) for f in fs)<600 else 1)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 256M }

  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - pgdata:/var/lib/postgresql
    shm_size: 256mb
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits: { cpus: "1.5", memory: 2048M }

  redis-cache:
    image: redis:8-alpine@sha256:7958cfbb9d152f87dadfbc89f1b0b15938f0b81ff8982feb327476f4911935c3
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru", "--save", "", "--appendonly", "no"]
    volumes:
      - redis_cache_data:/data
    networks: [internal]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 320M }

  redis-broker:
    image: redis:8-alpine@sha256:7958cfbb9d152f87dadfbc89f1b0b15938f0b81ff8982feb327476f4911935c3
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "512mb", "--maxmemory-policy", "noeviction", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redis_broker_data:/data
    networks: [internal]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 640M }

  # ARCADE-REDIS-BROKER-ISOLATION-001: the ZIP queue has its own broker.
  # zipnet contains only zip-worker and redis-zip; nothing on it can reach the
  # default broker, database, cache or edge.
  redis-zip:
    image: redis:8-alpine@sha256:7958cfbb9d152f87dadfbc89f1b0b15938f0b81ff8982feb327476f4911935c3
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "noeviction", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redis_zip_data:/data
    networks: [internal, zipnet]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 96M }

  # Predictable throttle counters (OD-REDIS-001): no eviction, no persistence.
  # Losing counters on restart is acceptable; eviction is not.
  redis-throttle:
    image: redis:8-alpine@sha256:7958cfbb9d152f87dadfbc89f1b0b15938f0b81ff8982feb327476f4911935c3
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction", "--save", "", "--appendonly", "no"]
    networks: [internal]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 160M }

  nginx:
    image: nginxinc/nginx-unprivileged:1.29-alpine
    restart: unless-stopped
    networks: [edge, internal, autotestnet]
    depends_on:
      web: { condition: service_healthy }
    volumes:
      - runtime_data:/app/runtime:ro
      - static_data:/app/staticfiles:ro
      - media_data:/app/media:ro
    healthcheck:
      # AD-001: проверяем реальный listener, а не только синтаксис конфига.
      test: ["CMD-SHELL", "nc -z -w 3 127.0.0.1 8443 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 192M }

  backup:
    <<: *app
    command: ["python", "manage.py", "backup_run"]
    environment:
      RUN_MIGRATIONS: "0"
    profiles: ["backup"]

  restore-check:
    <<: *app
    command: ["python", "manage.py", "restore_check"]
    environment:
      RUN_MIGRATIONS: "0"
    profiles: ["restore-check"]

networks:
  internal:
    internal: true
  edge:
  # ARCADE-BROWSER-AUTOTEST-001: nginx, web and the secretless browser runner.
  # No database, broker, cache or edge gateway is attached.
  autotestnet:
    internal: true
  # ARCADE-REDIS-BROKER-ISOLATION-001: only zip-worker and redis-zip; no
  # default broker, database, cache, edge or external gateway.
  zipnet:
    internal: true

volumes:
  pgdata:
  redis_cache_data:
  redis_broker_data:
  redis_zip_data:
  static_data:
  media_data:
  app_var:
  runtime_data:
  zip_uploads:
  zip_artifacts:
  zip_quota:
