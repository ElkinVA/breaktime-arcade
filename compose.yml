name: breaktime-arcade

x-app: &app
  image: ba/app:${IMAGE_TAG:-dev}
  build:
    context: .
    args:
      PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.14-slim-bookworm}
      NODE_IMAGE: ${NODE_IMAGE:-node:22-bookworm-slim}
      UV_VERSION: ${UV_VERSION:?задайте UV_VERSION в .env (make env)}
  restart: unless-stopped
  env_file: [.env]
  user: "10001:10001"
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
  volumes:
    - static_data:/app/staticfiles
    - media_data:/app/media
    - app_var:/app/var
  networks: [internal, edge]
  depends_on:
    db: { condition: service_healthy }
    redis-cache: { condition: service_healthy }
    redis-broker: { condition: service_healthy }
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  web:
    <<: *app
    environment:
      RUN_MIGRATIONS: "1"
      RUN_COLLECTSTATIC: "1"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    deploy:
      resources:
        limits: { cpus: "1.5", memory: 1536M }

  worker:
    <<: *app
    command: ["celery", "-A", "config", "worker", "-l", "info"]
    environment:
      RUN_MIGRATIONS: "0"
    depends_on:
      db: { condition: service_healthy }
      redis-cache: { condition: service_healthy }
      redis-broker: { condition: service_healthy }
      web: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME -t 10 | grep -q pong"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1024M }

  beat:
    <<: *app
    command: ["celery", "-A", "config", "beat", "-l", "info", "--schedule", "/app/var/celerybeat-schedule"]
    profiles: ["beat"]
    depends_on:
      redis-broker: { condition: service_healthy }
      web: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import glob,os,time,sys; fs=glob.glob('/app/var/celerybeat-schedule*'); sys.exit(0 if fs and time.time()-max(os.path.getmtime(f) for f in fs)<600 else 1)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 256M }

  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - pgdata:/var/lib/postgresql
    shm_size: 256mb
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits: { cpus: "1.5", memory: 2048M }

  redis-cache:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru", "--save", "", "--appendonly", "no"]
    volumes:
      - redis_cache_data:/data
    networks: [internal]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 320M }

  redis-broker:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "512mb", "--maxmemory-policy", "noeviction", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redis_broker_data:/data
    networks: [internal]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 640M }

  nginx:
    image: nginxinc/nginx-unprivileged:1.29-alpine
    restart: unless-stopped
    networks: [edge, internal]
    depends_on:
      web: { condition: service_healthy }
    volumes:
      - static_data:/app/staticfiles:ro
      - media_data:/app/media:ro
    healthcheck:
      # AD-001: проверяем реальный listener, а не только синтаксис конфига.
      test: ["CMD-SHELL", "nc -z -w 3 127.0.0.1 8443 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 192M }

  backup:
    <<: *app
    command: ["python", "manage.py", "backup_run"]
    environment:
      RUN_MIGRATIONS: "0"
    profiles: ["backup"]

  restore-check:
    <<: *app
    command: ["python", "manage.py", "restore_check"]
    environment:
      RUN_MIGRATIONS: "0"
    profiles: ["restore-check"]

networks:
  internal:
    internal: true
  edge:

volumes:
  pgdata:
  redis_cache_data:
  redis_broker_data:
  static_data:
  media_data:
  app_var:
