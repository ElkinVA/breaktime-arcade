name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-24.04
    services:
      db:
        image: postgres:18
        env:
          POSTGRES_DB: ba
          POSTGRES_USER: ba
          POSTGRES_PASSWORD: ba
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ba" --health-interval 10s
          --health-timeout 5s --health-retries 10
      redis-cache:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s
          --health-timeout 5s --health-retries 10
      redis-broker:
        image: redis:8-alpine
        ports: ["6380:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s
          --health-timeout 5s --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DJANGO_SECRET_KEY: ci-only
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: postgres://ba:ba@127.0.0.1:5432/ba
      REDIS_CACHE_URL: redis://127.0.0.1:6379/1
      REDIS_BROKER_URL: redis://127.0.0.1:6380/2
      CELERY_BROKER_URL: redis://127.0.0.1:6380/2
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv lock --check
      - run: uv run ruff check apps config tests
      - run: uv run ruff format --check apps config tests
      - run: uv run mypy
      - run: uv run python manage.py check
      - run: uv run python manage.py makemigrations --check --dry-run
      - run: uv run python -m pytest tests/unit/test_contract_schemas.py tests/unit/test_foundation_002_contracts.py
      - run: uv run pytest --cov=apps --cov-report=term-missing

  django-next:
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
      - run: uv sync --frozen
      - run: uv pip install --pre "django>=6.0"
      - run: uv run python manage.py check

  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
      - run: uv lock --check
      - run: docker build --build-arg UV_VERSION=$(uv --version | awk '{print $2}') -t ba/app:ci .
