name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-24.04
    services:
      db:
        image: postgres:18
        env:
          POSTGRES_DB: ba
          POSTGRES_USER: ba
          POSTGRES_PASSWORD: ba
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ba" --health-interval 10s
          --health-timeout 5s --health-retries 10
      redis-cache:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s
          --health-timeout 5s --health-retries 10
      redis-broker:
        image: redis:8-alpine
        ports: ["6380:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s
          --health-timeout 5s --health-retries 10
      redis-throttle:
        image: redis:8-alpine
        ports: ["6381:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s
          --health-timeout 5s --health-retries 10
      redis-zip:
        image: redis:8-alpine
        ports: ["6382:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s
          --health-timeout 5s --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DJANGO_SECRET_KEY: ci-only
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: postgres://ba:ba@127.0.0.1:5432/ba
      REDIS_CACHE_URL: redis://127.0.0.1:6379/1
      REDIS_BROKER_URL: redis://127.0.0.1:6380/2
      CELERY_BROKER_URL: redis://127.0.0.1:6380/2
      CELERY_ZIP_BROKER_URL: redis://127.0.0.1:6382/0
      REDIS_THROTTLE_URL: redis://127.0.0.1:6381/0
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv lock --check
      - run: uv run ruff check apps config tests devcontrol autonomy scripts
      - run: uv run ruff format --check apps config tests devcontrol autonomy scripts
      - run: uv run mypy
      - run: uv run python manage.py check
      - run: uv run python manage.py makemigrations --check --dry-run
      - run: uv run python -m pytest tests/unit/test_contract_schemas.py tests/unit/test_foundation_002_contracts.py
      - run: uv run pytest --cov=apps --cov-report=term-missing
      # Separate, measurable coverage for the autonomy/control plane. This is
      # diagnostic (no product threshold) and must not be merged into the
      # domain coverage gate silently.
      - run: >-
          uv run pytest tests/unit/test_autonomy.py tests/unit/test_autonomy_observability.py
          tests/unit/test_autonomy_security.py tests/unit/test_autonomy_budget.py
          tests/unit/test_autonomy_notify.py tests/unit/test_devcontrol.py
          --cov=autonomy --cov=devcontrol --cov-report=term-missing --cov-fail-under=0
        env:
          # Keep the diagnostic run from overwriting the product coverage file.
          COVERAGE_FILE: .coverage.autonomy

  django-next:
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
      - run: uv sync --frozen
      - run: uv pip install --pre "django>=6.0"
      - run: uv run python manage.py check

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run check:js
      - run: npm run test:js

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run playwright install --with-deps chromium
      - run: make env
      - name: Generate self-signed test certificates
        run: |
          mkdir -p certs
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout certs/portal.test-key.pem -out certs/portal.test.pem \
            -subj "/CN=portal.test" -addext "subjectAltName=DNS:portal.test"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout certs/games.test-key.pem -out certs/games.test.pem \
            -subj "/CN=*.games.test" \
            -addext "subjectAltName=DNS:*.games.test,DNS:games.test"
          chmod 644 certs/*.pem
      - run: echo "127.0.0.1 portal.test" | sudo tee -a /etc/hosts
      - run: make build
      - run: make up
      - run: WAIT_SECS=180 ./verify_stack.sh
      - run: make probe-seed
      - run: make undercover-seed
      - run: make e2e
      - name: Stop dev stack
        if: always()
        run: make down

  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
      - run: uv lock --check
      - run: docker build --build-arg UV_VERSION=$(uv --version | awk '{print $2}') -t ba/app:ci .
