{% extends "base.html" %}

{% block meta %}<meta name="robots" content="noindex, nofollow">{% endblock %}

{% block content %}
<div class="border-b border-text/10 bg-surface/50">
    <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-4">
        <nav class="flex items-center gap-4" aria-label="CRM">
            <span class="font-display font-bold text-accent">CRM</span>
            <a href="{% url 'crm:dashboard' %}" class="text-sm hover:text-accent" data-testid="crm-nav-dashboard">Дашборд</a>
            <a href="{% url 'crm:games' %}" class="text-sm hover:text-accent" data-testid="crm-nav-games">Игры</a>
        </nav>
        <div class="flex items-center gap-3">
            <span class="text-sm text-muted" data-testid="crm-current-user">{{ user.login }}</span>
            <form method="post" action="{% url 'crm:logout' %}">
                {% csrf_token %}
                <button type="submit" class="text-sm text-muted hover:text-accent" data-testid="crm-logout">Выйти</button>
            </form>
        </div>
    </div>
</div>

<div class="max-w-7xl mx-auto px-4 py-8">
    {% block crm_content %}{% endblock %}
</div>
{% endblock %}
