<tr class="border-b border-text/5 last:border-0" data-testid="crm-wizard-diff-row">
    <td class="px-3 py-2 align-top font-mono text-xs">{{ row.scope }}</td>
    <td class="px-3 py-2 align-top font-semibold">{{ row.field }}</td>
    <td class="px-3 py-2 align-top">{{ row.current|default:"—" }}</td>
    <td class="px-3 py-2 align-top">{{ row.incoming|default:"—" }}</td>
    <td class="px-3 py-2 align-top">{{ row.resolution }}</td>
</tr>
