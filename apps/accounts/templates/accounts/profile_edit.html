{% extends "base.html" %}
{% block title %}Edit profile — Breaktime Arcade{% endblock %}
{% block content %}
<section class="max-w-lg mx-auto px-4 py-10">
    <h1 class="text-3xl font-display font-bold mb-6">Edit profile</h1>
    <form method="post">
        {% csrf_token %}
        {% include "accounts/_form.html" with form=form %}
        <button type="submit" class="btn btn-primary px-6 py-2">Save</button>
        <a class="btn px-6 py-2" href="{% url 'account:profile' %}">Cancel</a>
    </form>
</section>
{% endblock %}
