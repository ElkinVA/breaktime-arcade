{% extends "base.html" %}
{% block title %}Recovery code — Breaktime Arcade{% endblock %}
{% block content %}
<section class="max-w-md mx-auto px-4 py-10">
    <h1 class="text-3xl font-display font-bold mb-2">Recovery code</h1>
    <p class="text-muted mb-6">Each recovery code can be used once.</p>
    <form method="post">
        {% csrf_token %}
        {% include "accounts/_form.html" with form=form %}
        <button type="submit" class="btn btn-primary px-6 py-2">Use recovery code</button>
    </form>
    <p class="mt-4 text-sm">
        <a class="text-accent" href="{% url 'accounts:two_factor_verify' %}">Back to authenticator code</a>
    </p>
</section>
{% endblock %}
