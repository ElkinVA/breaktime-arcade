{% extends "base.html" %}
{% block title %}Set new password — Breaktime Arcade{% endblock %}
{% block content %}
<section class="max-w-md mx-auto px-4 py-10">
    <h1 class="text-3xl font-display font-bold mb-4">Set a new password</h1>
    <form method="post">
        {% csrf_token %}
        {% include "accounts/_form.html" with form=form %}
        <button type="submit" class="btn btn-primary px-6 py-2">Save password</button>
    </form>
</section>
{% endblock %}
