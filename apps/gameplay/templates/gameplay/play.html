{% extends "base.html" %}
{% block title %}{% if title %}{{ title }}{% else %}Game{% endif %} — Breaktime Arcade{% endblock %}
{% block content %}
<section class="max-w-6xl mx-auto px-4 py-6">
    <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
        <a class="text-accent text-sm truncate max-w-[75%]" href="{% url 'catalog:game_detail' slug=game.slug %}">← {{ title|default:game.technical_id }}</a>
        <span class="text-xs text-muted">Breaktime Arcade</span>
    </div>
    <p id="player-status" class="mb-3 text-sm text-muted" role="status" hidden></p>
    <div class="rounded-lg overflow-hidden border border-white/10 bg-black/30">
        <iframe
            id="game-frame"
            title="{{ title }}"
            data-src="{{ runtime_url }}"
            data-portal-origin="{{ portal_origin }}"
            data-game-id="{{ game_id }}"
            data-csrf="{{ csrf_token }}"
            class="w-full min-h-[70dvh] border-0"
            sandbox="allow-scripts allow-same-origin"
            allow="fullscreen; gamepad; autoplay"
        ></iframe>
    </div>
</section>
{% endblock %}
{% block extra_js %}
<script type="module" src="/static/src/js/player.js" nonce="{{ csp_nonce }}"></script>
{% endblock %}
