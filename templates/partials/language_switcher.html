{% load portal_urls %}
<div class="relative">
    <button type="button" class="flex items-center gap-2 hover:text-accent"
            data-dropdown-toggle="lang-menu" aria-label="{{ current_language.name }}">
        <span class="hidden sm:inline">{{ current_language.name }}</span>
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
        </svg>
    </button>
    <div id="lang-menu" class="hidden absolute right-0 mt-2 w-40 bg-surface border border-text/10 rounded-lg shadow-lg z-50">
        {% for lang in active_languages %}
            <a href="{% language_url lang.code %}"
               class="block px-4 py-2 hover:bg-text/5 {% if lang.code == current_language_code %}text-accent{% endif %}">
                {{ lang.name }}
            </a>
        {% endfor %}
    </div>
</div>
