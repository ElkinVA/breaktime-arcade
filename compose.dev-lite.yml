# Профиль разработки dev-lite: пик ≈2.4 ГБ, лимит 3.8 GiB (§2.5).
# INSTALL_DEV=true включает pytest/ruff/mypy в /opt/venv только для dev-образов;
# staging/production собирают тот же Dockerfile с default=false.
x-dev-build: &dev-build
  build:
    args:
      INSTALL_DEV: "true"

services:
  runtime-init:
    image: ba/app:dev
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command: ["chown -R 10001:10001 /app/runtime && chmod 755 /app/runtime"]
    volumes:
      - runtime_data:/app/runtime
    restart: "no"

  web:
    <<: *dev-build
    depends_on:
      runtime-init:
        condition: service_completed_successfully
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      RUN_MIGRATIONS: "1"
      RUN_COLLECTSTATIC: "1"
      # nginx serves this shared volume; keep the pipeline publisher aligned.
      ZIP_PUBLIC_RUNTIME_ROOT: /app/runtime
    volumes:
      - .:/app
      - static_data:/app/staticfiles
      - media_data:/app/media
      - app_var:/app/var
      - runtime_data:/app/runtime
    ports:
      - "127.0.0.1:8000:8000"
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1024M }

  worker:
    <<: *dev-build
    command: ["celery", "-A", "config", "worker", "-Q", "default,celery", "-l", "info", "--pool=solo", "--concurrency=1"]
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
    volumes:
      - .:/app
      - media_data:/app/media
      - app_var:/app/var
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 512M }

  zip-worker:
    <<: *dev-build
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
    volumes:
      - .:/app:ro
      - zip_uploads:/var/ba/zip/uploads:ro
      - zip_artifacts:/var/ba/zip/artifacts

  beat:
    <<: *dev-build
    profiles: ["manual"]
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
    volumes:
      - .:/app
      - app_var:/app/var
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 192M }

  db:
    image: postgres:18@sha256:b9f6b8ff03b62f3cfd9d9ba3fe56226a9991c79d3fb46fd46536263bf02be553
    command: ["postgres", "-c", "shared_buffers=256MB", "-c", "max_connections=30", "-c", "work_mem=4MB"]
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 768M }

  redis-cache:
    image: redis:8-alpine@sha256:7958cfbb9d152f87dadfbc89f1b0b15938f0b81ff8982feb327476f4911935c3
    command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru", "--save", "", "--appendonly", "no"]
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 128M }

  redis-broker:
    image: redis:8-alpine@sha256:7958cfbb9d152f87dadfbc89f1b0b15938f0b81ff8982feb327476f4911935c3
    command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "noeviction", "--appendonly", "yes"]
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 128M }

  redis-throttle:
    image: redis:8-alpine@sha256:7958cfbb9d152f87dadfbc89f1b0b15938f0b81ff8982feb327476f4911935c3
    command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "noeviction", "--save", "", "--appendonly", "no"]
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 128M }

  nginx:
    image: nginxinc/nginx-unprivileged:1.29-alpine@sha256:0c79d56aee561a1d81c63f00eee5fb5fe29279560cdc55e91425133104c7fbe6
    ports:
      - "8443:8443"
    group_add:
      - "10002"
    volumes:
      - ./infra/nginx/dev.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - runtime_data:/app/runtime:ro
      - static_data:/app/staticfiles:ro
      - media_data:/app/media:ro
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 128M }

  # Те же dev-образы, чтобы `make build` не перезаписал ba/app:dev
  # образом без dev-зависимостей.
  backup:
    <<: *dev-build

  restore-check:
    <<: *dev-build

  # Только dev: почтовый sandbox. В staging/production не используется.
  mailpit:
    image: axllent/mailpit:latest@sha256:aef2aacc11f075ec0fb6874275ee4a421e688e11a96ebb296134d1735c7761ce
    restart: unless-stopped
    networks: [internal, edge]
    ports:
      - "127.0.0.1:8025:8025"
    environment:
      MP_MAX_MESSAGES: "5000"
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 128M }
