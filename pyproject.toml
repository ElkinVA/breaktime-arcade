[project]
name = "breaktime-arcade"
version = "0.1.0"
description = "Breaktime Arcade — портал коротких браузерных мини-игр (BA-PLAT-4.2)"
requires-python = ">=3.14,<3.15"
dependencies = [
    "packaging>=24",
    "django>=5.2.19,<5.3",
    "psycopg[binary,pool]==3.3.8",
    "celery==5.7.0",
    "redis>=5.2",
    "django-redis>=5.4",
    "djangorestframework>=3.16",
    "argon2-cffi>=23.1",
    "gunicorn>=23.0",
    "sentry-sdk>=2.19",
    "babel>=2.16",
    "jsonschema>=4.23",
    "pillow>=11.0",
    "pyotp>=2.9",
    "confusable-homoglyphs>=3.3",
    "boto3>=1.35",
    "django-storages[s3]>=1.14",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "pytest-cov>=6.0",
    "model-bakery>=1.20",
    "ruff>=0.9",
    "mypy>=1.16",
    "django-stubs[compatible-mypy]>=5.2",
    "pre-commit>=4.0",
    "playwright>=1.49",
]

# Точные версии прямых и транзитивных зависимостей фиксируются uv.lock (этап 0).
[tool.uv]
package = false
